[package]
name = "seqpage"
version = "0.1.0"
edition = "2021"
description = "The .seq page file: one multifaceted page as plain text, a view of a book (Director ruling R3)"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "seqpage"
path = "src/bin/seqpage.rs"

[dependencies]
seqaddr-core = { path = "../seqaddr-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
