[package]
name = "ask"
version = "0.1.0"
edition = "2021"
description = "Common-questions solver (Director ruling R11): key words of a prompt -> 1-3 pieces for the model, or a probe for the person"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
